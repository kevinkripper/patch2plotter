    /* ──────────────────────────────────────────────────────────────
       ────────────────────────────────────────────────────────────── */

    :root{
      --paper:#f7f7f4;
      --paper-deep:#eeeeea;
      --panel:#fbfbf8;
      --panel-open:#ffffff;
      --control:#fdfdfb;
      --control-hover:#f1f1ed;
      --ink:#161616;
      --ink-soft:#444;
      --muted:#737373;
      --line:#aaaaa6;
      --line-soft:#deded9;
      --line-dark:#969690;
      --blue:#363636;
      --shadow:0 1px 0 rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.035);
      --ui-font:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    }

    html{background:var(--paper)}
    body{
      grid-template-columns:352px minmax(0,1fr);
      color:var(--ink);
      font-family:var(--ui-font);
      background:
        radial-gradient(circle at 20% 10%,rgba(255,255,255,.72),transparent 28%),
        linear-gradient(135deg,rgba(0,0,0,.012) 25%,transparent 25%) 0 0/4px 4px,
        var(--paper);
    }

    aside{
      padding:14px 12px 22px;
      background:
        linear-gradient(rgba(255,255,255,.38),rgba(255,255,255,.10)),
        repeating-linear-gradient(0deg,rgba(0,0,0,.009) 0,rgba(0,0,0,.009) 1px,transparent 1px,transparent 4px),
        var(--paper-deep);
      border-right:1px solid var(--line-dark);
      box-shadow:5px 0 18px rgba(0,0,0,.035);
      scrollbar-color:#aaa transparent;
      scrollbar-width:thin;
    }
    aside::-webkit-scrollbar{width:9px}
    aside::-webkit-scrollbar-track{background:transparent}
    aside::-webkit-scrollbar-thumb{background:#b9b9b4;border:3px solid var(--paper-deep);border-radius:9px}

    .title-line{gap:9px;align-items:flex-end;padding:2px 2px 0}
    h1{
      font-size:19px;
      letter-spacing:-.045em;
      font-weight:700;
      margin:0 0 4px;
    }
    .title-credit{font-size:10px;color:var(--muted);margin-bottom:5px}
    .title-credit a{color:inherit;text-decoration-thickness:1px;text-underline-offset:3px}
    .tagline{margin:1px 2px 16px;max-width:285px;font-size:10px;line-height:1.45;color:#696969}
    .title-divider{height:0;border-top:1px solid #aaa;border-bottom:1px solid rgba(255,255,255,.8);margin:0 1px 12px}

    .panel{
      position:relative;
      background:rgba(251,251,248,.9);
      border:1px solid var(--line);
      border-radius:3px;
      padding:8px 9px;
      margin:0 0 8px;
      box-shadow:var(--shadow);
      overflow:visible;
    }
    .panel[open]{
      background:var(--panel-open);
      border-color:#aaa;
      box-shadow:0 1px 0 rgba(255,255,255,.75) inset,0 1px 0 rgba(0,0,0,.08),0 5px 15px rgba(0,0,0,.04);
    }
    .load-panel{
      margin-top:0;
      padding:10px;
      background:#fdfdfb;
      border-color:#aaa;
    }

    .section-title{
      min-height:25px;
      padding:1px 0 5px;
      margin:0;
      border-bottom:0;
      color:#2d2d2d;
      font-size:10px;
      line-height:1.2;
      letter-spacing:.075em;
      font-weight:700;
    }
    details[open]>.section-title{
      margin-bottom:8px;
      padding-bottom:7px;
      border-bottom:1px solid var(--line-soft);
    }
    details>.section-title:before{
      width:16px;
      color:#555;
      content:'＋';
      font-size:12px;
      font-weight:400;
      transform:translateY(-.5px);
    }
    details[open]>.section-title:before{content:'−'}
    .section-enable{
      gap:6px;
      color:#666;
      font-size:9px;
      letter-spacing:.02em;
    }

    .field,.check,.hint,.preview-zoom-row span,.curvature-row .check,.bg-amount-row span{
      font-family:var(--ui-font);
    }
    .field{gap:4px;margin-bottom:7px;font-size:10px;color:#333}
    .field span{color:#555;letter-spacing:.015em}
    .check{font-size:10px;color:#333;gap:7px}
    .hint{font-size:10px;color:var(--muted)}

    input,button,select{
      min-height:29px;
      padding:5px 7px;
      border:1px solid #aaa;
      border-radius:2px;
      background:var(--control);
      color:var(--ink);
      font-family:var(--ui-font);
      font-size:10px;
      box-shadow:0 1px 0 rgba(255,255,255,.9) inset;
      transition:background-color .12s ease,border-color .12s ease,box-shadow .12s ease,transform .08s ease;
    }
    input:hover,select:hover{border-color:#7d7d7d}
    input:focus-visible,select:focus-visible,button:focus-visible,.file-display:focus-visible{
      outline:1px solid #222;
      outline-offset:2px;
    }
    button{
      background:linear-gradient(#f8f8f5,#e8e8e4);
      border-color:#999;
      font-weight:700;
      letter-spacing:.015em;
      text-shadow:0 1px 0 #fff;
    }
    button:hover{background:linear-gradient(#fff,#ededE9);border-color:#707070}
    button:active{transform:translateY(1px);background:#e3e3df;box-shadow:0 1px 2px rgba(0,0,0,.08) inset}
    input:disabled,select:disabled,button:disabled{opacity:.38;filter:grayscale(1)}

    input[type="checkbox"]{
      width:14px;height:14px;min-height:0;
      border-radius:1px;
      accent-color:#3f3f3f;
      box-shadow:none;
    }
    input[type="color"]{
      height:29px;
      padding:3px;
      background:#f4f4f1;
    }
    input[type="range"]{
      height:22px;
      min-height:22px;
      padding:0;
      border:0;
      background:transparent;
      box-shadow:none;
      accent-color:#444;
    }
    input[type="range"]::-webkit-slider-runnable-track{height:2px;background:#9b9b96;border-radius:0}
    input[type="range"]::-webkit-slider-thumb{
      -webkit-appearance:none;
      width:12px;height:16px;
      margin-top:-7px;
      border:1px solid #555;
      border-radius:1px;
      background:#f8f8f5;
      box-shadow:0 1px 2px rgba(0,0,0,.15);
    }

    .file-display{
      height:32px;
      justify-content:flex-start;
      padding:6px 9px;
      border-radius:2px;
      border-color:#999;
      background:#f8f8f5;
      color:#444;
      font-size:10px;
      text-align:left;
      box-shadow:0 1px 2px rgba(0,0,0,.035) inset;
    }
    .load-panel .row3{gap:5px!important}
    #read,#reset,#export{min-height:31px}
    #read,#export{background:linear-gradient(#ececea,#dcdcd8);border-color:#838383;color:#171717}
    #export{background:linear-gradient(#444,#292929);color:#fff;border-color:#1c1c1c;text-shadow:0 -1px 0 rgba(0,0,0,.45);box-shadow:0 1px 0 rgba(255,255,255,.15) inset}
    #export:hover{background:linear-gradient(#555,#333)}

    .preview-zoom-row{
      gap:10px;
      margin-top:9px;
      padding-top:8px;
      border-top:1px solid var(--line-soft);
    }
    .preview-zoom-row span,.bg-amount-row span{font-size:9px;text-transform:uppercase;letter-spacing:.055em;color:#666}

    .text-toggle-group .check,.hatch-top-row .check,.random-hatch-inline,.technical-extension-toggle{
      border-color:#c5c5c0;
      border-radius:2px;
      background:#f4f4f1;
      box-shadow:0 1px 0 rgba(255,255,255,.8) inset;
    }
    .random-hatch-inline{min-height:43px}
    .hatch-seed-button{border-radius:2px;background:#ededE9;text-shadow:none}
    .random-hatch-link{background:#aaa}
    .codebox-disabled-note{font-size:9px;color:#888;line-height:1.45}

    .spread-grid{column-gap:8px;row-gap:6px;margin:4px 0 2px}
    .spread-axis{font-size:10px;font-weight:700;color:#555}
    .spread-value-wrap{
      border-radius:2px;
      border-color:#aaa;
      background:#fafaf8;
    }
    .spread-value-wrap input{font-size:9px;height:27px;font-family:var(--ui-font)}
    .spread-value-wrap span{font-size:9px;color:#777}
    .spread-sync-icon{
      width:23px;height:23px;
      border-radius:2px;
      border-color:#999;
      background:#f5f5f2;
      filter:grayscale(1);
      font-size:12px;
    }
    .spread-sync-toggle input:checked + .spread-sync-icon{background:#3f3f3f;border-color:#222;color:#fff}
    .spread-sync-toggle:before,.spread-sync-toggle:after{background:#aaa}

    .technical-name-row{gap:6px}
    .technical-extension-toggle{min-height:29px}

    a{color:#222;text-decoration-thickness:1px}

    #svg{
      background:
        radial-gradient(circle at 35% 22%,rgba(255,255,255,.95),rgba(255,255,255,.55) 38%,transparent 66%),
        repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0,rgba(0,0,0,.012) 1px,transparent 1px,transparent 5px),
        #f2f2ef;
      box-shadow:8px 0 28px rgba(0,0,0,.035) inset;
    }

    @media (max-width:860px){
      body{grid-template-columns:320px minmax(0,1fr)}
    }

    .tagline{
      margin:0 0 14px;
      white-space:nowrap;
      font-size:9px;
      letter-spacing:-.01em;
    }

    .load-panel{margin-bottom:12px}

    aside > details.panel{
      margin:0;
      padding:0;
      border:1px solid var(--line);
      border-radius:0;
      background:rgba(250,250,248,.72);
      box-shadow:none;
      overflow:hidden;
    }
    aside > details.panel + details.panel{border-top:0}
    aside > details.panel:first-of-type{
      border-radius:3px 3px 0 0;
    }
    aside > details.panel:last-of-type{
      border-radius:0 0 3px 3px;
      margin-bottom:10px;
    }

    aside > details.panel > .section-title{
      min-height:31px;
      margin:0;
      padding:7px 8px;
      border:0;
      background:transparent;
    }
    aside > details.panel[open] > .section-title{
      background:#eeeeeb;
      border-bottom:1px solid var(--line);
    }
    aside > details.panel > .section-title:hover{
      background:#f1f1ee;
    }
    aside > details.panel[open] > :not(.section-title){
      margin-left:9px;
      margin-right:9px;
    }
    aside > details.panel[open] > :nth-child(2){
      margin-top:9px;
    }
    aside > details.panel[open] > :last-child{
      margin-bottom:9px;
    }

    .codebox-disabled-note{display:none!important}

    .patchcoords-curve-panel .patchcoords-curvature{
      position:relative;
      top:-3px;

    .patchcoords-bottom-row{margin-top:2px}

    .hatch-top-row + .row3.tight-row{margin-top:2px}
    .bg-row + .bg-amount-row{margin-top:2px}

    .hatch-top-row>.check,

      height:39px;

let currentPatchBaseName = 'patch';

function fileNameWithoutSupportedExtension(name){
  return String(name || '').replace(/\.(maxpat|maxhelp|genjit|json)$/i, '');
}
function updateTechnicalPatchNameFromFile(){
  const field = document.querySelector('#technicalPatchName');
  const includeExtension = document.querySelector('#technicalIncludeExtension')?.checked ?? true;
  if(field) field.value = includeExtension ? currentPatchFileName : currentPatchBaseName;
}
function fileDateValue(file){
  const date = new Date(file.lastModified);
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function formatTechnicalDate(value, format='dmy'){
  const match = String(value || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!match) return String(value || '');
  const [, year, month, day] = match;
  if(format === 'mdy') return `${month}/${day}/${year}`;
  if(format === 'ymd') return `${year}/${month}/${day}`;
  return `${day}/${month}/${year}`;
}

function updateTechnicalDateDisplay(){
  const dateInput = document.querySelector('#technicalDate');
  const display = document.querySelector('#technicalDateDisplay');
  const format = document.querySelector('#technicalDateFormat')?.value || 'dmy';

    } else {
      const points=samplePatchcoordPoints(sx,sy,dx,dy,o.curvy,c);
      drawClippedPolyline(patchcoordGroup,points,technicalClipRect,{width:strokeWidthMM(o.cableWidth),color:o.cableColor,linecap:'round',linejoin:'round'});
    }
  });

  (patch.boxes||[]).forEach((Box, boxIndex)=>{
    const box=Box.box, rawR=box.patching_rect||[0,0,80,20];
    const r=layoutRectForBox(box, o, layoutRects);
    const isComment=box.maxclass==='comment';
    const radius=(box.maxclass==='message'||box.maxclass==='function')?5:0;
    const label = labelForBox(box, rawR, o);
    const alwaysHatchClasses = ['panel', 'fpic', 'jit.pwindow', 'jit.pworld', 'lcd'];
    const hatchIfEmptyClasses = ['newobj', 'message', 'bpatcher'];
    const hatchableEmptyObject =
      alwaysHatchClasses.includes(box.maxclass) ||
      (hatchIfEmptyClasses.includes(box.maxclass) && !label) ||
      (isCodeboxObject(box) && !o.enableCodebox);
    if(!isComment && o.emptyObjectHatch && hatchableEmptyObject) {
      const hatchRect = emptyHatchingRectForBox(box, r);
      if(hatchRect[2] > 0 && hatchRect[3] > 0) {
        const objectId = svgSafeId(box.id || `object-${boxIndex + 1}`);
        const objectHatching = getModuleHatching().group().id(`empty_${objectId}`);
        const objectHatchOptions = emptyHatchOptionsForBox(box, boxIndex, o);
        drawHatching(objectHatching, hatchRect, objectHatchOptions);
      }
    }
    if(o.showObjectOutlines && !isComment && o.moduleWidth>0){
      getModules().rect(r[2],r[3]).radius(radius).move(r[0],r[1]).fill('none').stroke({width:strokeWidthMM(o.moduleWidth),color:o.moduleColor});
    }
    if(o.showObjectOutlines && box.maxclass==='newobj' && o.moduleWidth>0){
      drawNewObjBorderBands(
        getModules(),
        o.bandHatch ? getNewobjBarHatching() : null,
        r,
        o
      );
    }
    if(o.showObjectOutlines && box.maxclass==='button'){
      const w=o.moduleWidth;
      getModules().circle(r[2]/1.5).center(r[0]+r[2]/2,r[1]+r[3]/2).fill('none').stroke({width:strokeWidthMM(w),color:o.moduleColor});
    }
    if(o.showObjectOutlines && box.maxclass==='toggle'){
      const border=r[2]*0.25, w=o.moduleWidth;
      getModules().line(r[0]+border,r[1]+border,r[0]+r[2]-border,r[1]+r[3]-border).stroke({width:strokeWidthMM(w),color:o.moduleColor});
      getModules().line(r[0]+r[2]-border,r[1]+border,r[0]+border,r[1]+r[3]-border).stroke({width:strokeWidthMM(w),color:o.moduleColor});
    }
    let textOffset=(box.maxclass==='number'||box.maxclass==='flonum'||box.maxclass==='number~')?14:4;
    if(isCodeboxObject(box)){
      if(o.enableCodebox && label){
        drawStrokeText(getCodeboxTextGroup(),label,r[0]+6,r[1]+6,o.codeboxTextSize,o.codeboxTextColor,o.codeboxTextWidth,o.codeboxFont);
      }
    } else if(label && o.showText){
      const capsYOffset = o.forceCaps ? 2 : 0;
      const multilineYOffset = !o.forceCaps && label.includes('\n') ? 3 : 0;
      const textY = r[1] + Math.max(4, (r[3] - estimateStrokeTextHeight(label,o.textSize)) / 2) + 2 + capsYOffset + multilineYOffset;
      drawStrokeText(getTextGroup(),label,r[0]+textOffset,textY,o.textSize,o.textColor,o.textWidth,o.hersheyFont);
    }
    if(o.showObjectOutlines && (box.maxclass==='number' || box.maxclass==='flonum')){
      const cy=r[1]+r[3]/2;
      getModules().path(`M${r[0]+4} ${cy-5} L${r[0]+10} ${cy} L${r[0]+4} ${cy+5}`).fill('none').stroke({width:strokeWidthMM(o.moduleWidth),color:o.moduleColor,linejoin:'round'});
    }
    if(o.showObjectOutlines && box.maxclass==='number~'){
      drawStrokeText(getModules(),'~',r[0]+4,r[1]+2,12,o.moduleColor,o.moduleWidth,o.hersheyFont);
    }
  });

  if(technicalLabel){
    const technicalGroup=artwork.group().id('technical_label');
    drawTechnicalLabel(technicalGroup,technicalLabel,o);
  }

  applyPreviewZoom();
  return draw;
}

function resetControls(){
  emptyHatchRandomSeed = 1;

  document.querySelectorAll('input, select').forEach(el => {
    if(el.id === 'fileInput') return;
    if(el.type === 'checkbox') el.checked = el.dataset.defaultChecked === '1';
    else el.value = el.dataset.defaultValue ?? el.defaultValue;
  });

  updateSpreadLabels();
  setHatchControlsEnabled();
  if(patch) redraw();
  else applyPreviewZoom();
}

function setControlsEnabled(ids, enabled){
  ids.forEach(id => {
    const el = document.querySelector('#' + id);
    if(el) el.disabled = !enabled;
  });
}

function codeboxObjectName(box){
  const maxclass = String(box?.maxclass || '').trim().toLowerCase();
  const textName = String(box?.text || '').trim().split(/\s+/)[0].toLowerCase();
  return maxclass.includes('codebox') ? maxclass : textName;
}

function isCodeboxObject(box){
  const name = codeboxObjectName(box);
  return name === 'codebox' ||
         name === 'codebox~' ||
         name.endsWith('.codebox') ||
         name.endsWith('.codebox~');
}

function patchHasCodebox(patchData){
  return !!(patchData?.boxes || []).some(Box => isCodeboxObject(Box?.box));
}

function updateCodeboxUI(){
  const available = patchHasCodebox(patch);
  const enabled = available && (document.querySelector('#enableCodebox')?.checked ?? true);
  const panel = document.querySelector('#codeboxPanel');
  const note = document.querySelector('#codeboxUnavailableNote');

  if(panel) panel.classList.toggle('codebox-unavailable', !available);
  if(note) note.hidden = available;

  setControlsEnabled(['enableCodebox'], available);
  setControlsEnabled(
    ['codeboxFont','codeboxTextSize','codeboxTextWidth','codeboxTextColor'],
    enabled
  );
}

function setHatchControlsEnabled(){
  const textOn = document.querySelector('#showText').checked;
  const outlinesOn = document.querySelector('#showObjectOutlines').checked;
  const patchcoordsOn = document.querySelector('#showPatchcoords').checked;
  const curvyOn = patchcoordsOn && document.querySelector('#curvy').checked;
  const backgroundOn = document.querySelector('#enableBackgroundPattern').checked;
  const emptyHatchOn = document.querySelector('#emptyObjectHatch').checked;
  const bandHatchOn = document.querySelector('#bandHatch').checked;

  setControlsEnabled(['technicalPatchName','technicalAuthor','technicalDate','technicalDateFormat'], document.querySelector('#showTechnicalLabel').checked);
  setControlsEnabled(['wrapText','forceCaps','hersheyFont','textSize','textWidth','textColor'], textOn);
  setControlsEnabled(['moduleColor','moduleWidth'], outlinesOn);
  setControlsEnabled(['cableColor','cableWidth','curvy','autoDashPatchcoords'], patchcoordsOn);
  setControlsEnabled(['curvature'], curvyOn);
  setControlsEnabled(['bgMode','bgColor','bgAmount'], backgroundOn);
  setControlsEnabled(['backgroundColor'], true);
  updateEmptyHatchRandomUI();
  setControlsEnabled(['bandHatchColor','bandHatchWidth','bandHatchSpacing','bandHatchAngle','bandHatchCross'], bandHatchOn);
  updateCodeboxUI();
}

function clampControlNumber(value, control){
  let n = Number(value);
  if(!Number.isFinite(n)) n = Number(control.value) || 0;
  const min = control.min === '' ? -Infinity : Number(control.min);
  const max = control.max === '' ? Infinity : Number(control.max);
  return Math.min(max, Math.max(min, n));
}

function syncSpreadValues(sourceAxis){
  const sync = document.querySelector('#spreadSync');
  if(!sync?.checked) return;

  const source = document.querySelector(sourceAxis === 'Y' ? '#spreadY' : '#spreadX');
  const target = document.querySelector(sourceAxis === 'Y' ? '#spreadX' : '#spreadY');
  if(!source || !target) return;

  target.value = source.value;
}

function setSpreadFromControl(axis, value){
  const slider = document.querySelector(axis === 'Y' ? '#spreadY' : '#spreadX');
  const number = document.querySelector(axis === 'Y' ? '#spreadYValue' : '#spreadXValue');
  if(!slider || !number) return;

  slider.value = value;
  number.value = value;
  lastSpreadAxis = axis;
  syncSpreadValues(axis);
  updateSpreadLabels();
}

function updateSpreadLabels(){
  const pairs = [['spreadX','spreadXValue'], ['spreadY','spreadYValue']];
  pairs.forEach(([sliderId, valueId]) => {
    const slider = document.querySelector('#' + sliderId);
    const value = document.querySelector('#' + valueId);
    if(slider && value && document.activeElement !== value) value.value = slider.value;
  });
}

function capturePreviewState(){
  const viewport = document.querySelector('#svg');
  return viewport ? { left: viewport.scrollLeft, top: viewport.scrollTop } : { left: 0, top: 0 };
}

function restorePreviewState(state, generation){
  const viewport = document.querySelector('#svg');
  if(!viewport || !state || generation !== previewRestoreGeneration) return;
  viewport.scrollLeft = state.left;
  viewport.scrollTop = state.top;
}

function redraw(){
  updateSpreadLabels();
  setHatchControlsEnabled();
  if(!patch) return;

  // Capture once for a whole burst of input/change events. This prevents the
  // second event from saving the temporary 0,0 position while the SVG is being rebuilt.
  if(!pendingPreviewState) pendingPreviewState = capturePreviewState();
  if(pendingRedrawFrame !== null) return;

  pendingRedrawFrame = requestAnimationFrame(() => {
    pendingRedrawFrame = null;
    const saved = pendingPreviewState || capturePreviewState();
    pendingPreviewState = null;
    const generation = ++previewRestoreGeneration;

    draw = drawSVG(patch);

    // Wait for SVG.js, transforms, spacer sizing and browser layout to settle.
    requestAnimationFrame(() => {
      restorePreviewState(saved, generation);
      requestAnimationFrame(() => restorePreviewState(saved, generation));
    });
  });
}

function initializeControlDefaults(){
  document.querySelectorAll('input, select').forEach(el => {
    if(el.id === 'fileInput') return;
    if(el.type === 'checkbox') el.dataset.defaultChecked = el.checked ? '1' : '0';
    else el.dataset.defaultValue = el.value;
  });
}

function restoreControlDefault(el){
  if(!el || el.disabled) return;

  if(el.id === 'spreadXValue' || el.id === 'spreadYValue'){
    const slider = document.querySelector(el.id === 'spreadXValue' ? '#spreadX' : '#spreadY');
    if(slider){
      slider.value = slider.dataset.defaultValue ?? slider.defaultValue;
      el.value = slider.value;
    }
    redraw();
    return;
  }

  if(el.type === 'checkbox') el.checked = el.dataset.defaultChecked === '1';
  else el.value = el.dataset.defaultValue ?? el.defaultValue;

  if(el.id === 'spreadX' || el.id === 'spreadY') updateSpreadLabels();
  if(el.id === 'previewZoom') applyPreviewZoom();
  else redraw();
}

function enableDoubleClickDefaults(){
  document.querySelectorAll('input, select').forEach(el => {
    if(el.id === 'fileInput') return;
    el.title = el.title ? `${el.title} · Double-click to reset` : 'Double-click to reset';
    el.addEventListener('dblclick', event => {
      event.preventDefault();
      event.stopPropagation();
      restoreControlDefault(el);
    });
  });
}

function updateEmptyHatchRandomUI(){
  const randomize = document.querySelector('#randomizeEmptyHatching');
  const seedButton = document.querySelector('#randomizeEmptyHatchingSeed');
  const emptyEnabled = document.querySelector('#emptyObjectHatch')?.checked ?? false;
  const randomActive = emptyEnabled && (randomize?.checked ?? false);

  setControlsEnabled(['randomizeEmptyHatching'], emptyEnabled);
  setControlsEnabled(['randomizeEmptyHatchingSeed'], randomActive);

  // Random mode owns angle and spacing. Width and color always stay global.
  setControlsEnabled(['hatchAngle','hatchSpacing'], emptyEnabled && !randomActive);
  setControlsEnabled(['hatchCross','hatchColor','hatchWidth'], emptyEnabled);

  if(seedButton){
    seedButton.title = randomActive
      ? 'Generate a new random angle, spacing, and crosshatch variation'
      : 'Enable Randomize to generate a new variation';
  }
}

const randomizeEmptyHatchingToggle = document.querySelector('#randomizeEmptyHatching');
if(randomizeEmptyHatchingToggle){
  randomizeEmptyHatchingToggle.addEventListener('change', () => {
    if(randomizeEmptyHatchingToggle.checked){
      emptyHatchRandomSeed = Math.floor(Math.random() * 2147483646) + 1;
    }
    updateEmptyHatchRandomUI();
    redraw();
  });
}

const randomizeEmptyHatchingSeedButton = document.querySelector('#randomizeEmptyHatchingSeed');
if(randomizeEmptyHatchingSeedButton){
  randomizeEmptyHatchingSeedButton.addEventListener('click', () => {
    if(!document.querySelector('#randomizeEmptyHatching')?.checked) return;
    emptyHatchRandomSeed = Math.floor(Math.random() * 2147483646) + 1;
    redraw();
  });
}

document.querySelector('#reset').addEventListener('click', resetControls);

document.querySelector('#read').addEventListener('click',()=>{
  const input=document.querySelector('#fileInput');
  if(input) input.click();
});
document.querySelector('#fileInput').addEventListener('change',()=>{
  const file=document.querySelector('#fileInput').files[0]; if(!file)return;
  const nameEl=document.querySelector('#fileName');
  if(nameEl) nameEl.textContent=file.name;
  currentPatchFileName=file.name;
  currentPatchBaseName=fileNameWithoutSupportedExtension(file.name);
  updateTechnicalPatchNameFromFile();
  const technicalDate=document.querySelector('#technicalDate');
  if(technicalDate) technicalDate.value=fileDateValue(file);
  updateTechnicalDateDisplay();
  const reader=new FileReader();
  reader.onloadend=()=>{
    try {
      const json=JSON.parse(reader.result);
      patch=json.patcher||json;
      updateCodeboxUI();
      draw=drawSVG(patch);
    } catch(error) {
      console.error(error);
      alert('Could not read this Max patch.');
    }
  };
  reader.readAsText(file);
});
const technicalIncludeExtension = document.querySelector('#technicalIncludeExtension');
if(technicalIncludeExtension){
  technicalIncludeExtension.addEventListener('change', updateTechnicalPatchNameFromFile);
}

['showTechnicalLabel','technicalPatchName','technicalIncludeExtension','technicalAuthor','technicalDate','technicalDateFormat',
'enableCodebox','codeboxFont','codeboxTextSize','codeboxTextWidth','codeboxTextColor',
'showObjectOutlines','showPatchcoords','enableBackgroundPattern','curvy','curvature','autoDashPatchcoords','bgMode','bgColor','backgroundColor','bgAmount','showText','wrapText','forceCaps','hersheyFont','textSize','moduleColor','moduleWidth','emptyObjectHatch','hatchColor','hatchWidth','hatchSpacing','hatchAngle','hatchCross','bandHatch','bandHatchColor','bandHatchWidth','bandHatchSpacing','bandHatchAngle','bandHatchCross','cableColor','cableWidth','textColor','textWidth'].forEach(id=>{
  const el=document.querySelector('#'+id);
  if(!el) return;
  el.addEventListener('change',redraw);
  el.addEventListener('input',redraw);
});

[['spreadX','spreadXValue','X'], ['spreadY','spreadYValue','Y']].forEach(([sliderId, valueId, axis]) => {
  const slider = document.querySelector('#' + sliderId);
  const value = document.querySelector('#' + valueId);
  if(!slider || !value) return;

  slider.addEventListener('input', () => {
    setSpreadFromControl(axis, slider.value);
    redraw();
  });
  slider.addEventListener('change', () => {
    setSpreadFromControl(axis, slider.value);
    redraw();
  });

  const commitValue = () => {
    const next = clampControlNumber(value.value, value);
    setSpreadFromControl(axis, next);
    redraw();
  };
  value.addEventListener('input', commitValue);
  value.addEventListener('change', commitValue);
});

const spreadSync = document.querySelector('#spreadSync');
if(spreadSync){
  spreadSync.addEventListener('change', () => {
    if(spreadSync.checked){
      syncSpreadValues(lastSpreadAxis);
      updateSpreadLabels();
    }
    redraw();
  });
}

const technicalDateInput=document.querySelector('#technicalDate');
if(technicalDateInput && !technicalDateInput.value){
  const now=new Date();
  technicalDateInput.value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
}
updateTechnicalDateDisplay();
document.querySelector('#technicalDate')?.addEventListener('input', updateTechnicalDateDisplay);
document.querySelector('#technicalDate')?.addEventListener('change', updateTechnicalDateDisplay);
document.querySelector('#technicalDateFormat')?.addEventListener('change', updateTechnicalDateDisplay);

const technicalDateControl=document.querySelector('.technical-date-control');
if(technicalDateControl && technicalDateInput){
  technicalDateControl.setAttribute('role','button');
  technicalDateControl.setAttribute('tabindex','0');
  technicalDateControl.setAttribute('aria-label','Choose date');
  const openTechnicalDatePicker=()=>{
    if(technicalDateInput.disabled) return;
    try{
      if(typeof technicalDateInput.showPicker==='function') technicalDateInput.showPicker();
      else{ technicalDateInput.focus(); technicalDateInput.click(); }
    }catch(error){
      technicalDateInput.focus();
    }
  };
  technicalDateControl.addEventListener('click', openTechnicalDatePicker);
  technicalDateControl
}
initializeControlDefaults();
enableDoubleClickDefaults();
updateSpreadLabels();
document.querySelector('#previewZoom').addEventListener('input',applyPreviewZoom);

let pinchStartDistance = null;
let pinchStartZoom = null;
const viewport = document.querySelector('#svg');
function touchDistance(touches){
  const a=touches[0], b=touches[1];
  return Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
}
viewport.addEventListener('touchstart', (e)=>{
  if(e.touches.length===2){
    pinchStartDistance = touchDistance(e.touches);
    pinchStartZoom = parseFloat(document.querySelector('#previewZoom').value)||100;
    e.preventDefault();
  }
}, {passive:false});
viewport.addEventListener('touchmove', (e)=>{
  if(e.touches.length===2 && pinchStartDistance){
    const ratio = touchDistance(e.touches)/pinchStartDistance;
    const el=document.querySelector('#previewZoom');
    el.value = Math.max(25, Math.min(300, pinchStartZoom*ratio));
    applyPreviewZoom();
    e.preventDefault();
  }
}, {passive:false});
viewport.addEventListener('touchend', ()=>{
  pinchStartDistance = null;
  pinchStartZoom = null;
});
viewport.addEventListener('wheel', (e)=>{
  if(!e.ctrlKey && !e.metaKey) return;
  const el=document.querySelector('#previewZoom');
  const delta = e.deltaY < 0 ? 10 : -10;
  el.value = Math.max(25, Math.min(300, parseFloat(el.value)+delta));
  applyPreviewZoom();
  e.preventDefault();
}, {passive:false});

setHatchControlsEnabled();
document.querySelectorAll('.section-enable').forEach(label=>{
  label.addEventListener('click', e=>e.stopPropagation());
  const input=label.querySelector('input');
  if(input) input.addEventListener('click', e=>e.stopPropagation());
});
document.querySelector('#export').addEventListener('click',()=>{
  if(!draw) return alert('Read a Max patch first');
  const blob=new Blob([draw.svg()],{type:'image/svg+xml'});
  const a=document.createElement('a');
  a.download='patch2plotter.svg';
  a.href=URL.createObjectURL(blob);
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 0);
});


</script>
